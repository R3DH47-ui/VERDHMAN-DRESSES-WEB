<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B2500" />
      <stop offset="50%" stop-color="#A52A2A" />
      <stop offset="100%" stop-color="#7B1E00" />
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="600" fill="url(#sky)" />

  <!-- Heritage School Building with Arches -->
  <!-- Main building block -->
  <rect x="150" y="140" width="900" height="340" fill="url(#brick)" />
  <rect x="420" y="80" width="360" height="60" fill="#7B1E00" />
  <!-- Central pediment & clock tower -->
  <polygon points="600,30 460,80 740,80" fill="#6B1800" />
  <circle cx="600" cy="62" r="14" fill="#FFFFFF" stroke="#8B2500" stroke-width="2" />
  <line x1="600" y1="62" x2="600" y2="54" stroke="#111111" stroke-width="2" />
  <line x1="600" y1="62" x2="607" y2="62" stroke="#111111" stroke-width="2" />

  <!-- Pillars & Colonnades -->
  <g fill="#D4A373">
    <rect x="180" y="160" width="24" height="240" />
    <rect x="250" y="160" width="24" height="240" />
    <rect x="320" y="160" width="24" height="240" />
    <rect x="390" y="160" width="24" height="240" />
    <rect x="780" y="160" width="24" height="240" />
    <rect x="850" y="160" width="24" height="240" />
    <rect x="920" y="160" width="24" height="240" />
    <rect x="990" y="160" width="24" height="240" />
  </g>

  <!-- Arched Windows -->
  <g fill="#1E293B">
    <path d="M460,240 A30,30 0 0,1 520,240 L520,320 L460,320 Z" />
    <path d="M570,240 A30,30 0 0,1 630,240 L630,320 L570,320 Z" />
    <path d="M680,240 A30,30 0 0,1 740,240 L740,320 L680,320 Z" />
    <path d="M480,340 A60,60 0 0,1 720,340 L720,480 L480,480 Z" />
  </g>

  <!-- Trees / Greenery -->
  <circle cx="90" cy="380" r="110" fill="#15803D" />
  <circle cx="140" cy="420" r="90" fill="#166534" />
  <circle cx="1110" cy="380" r="110" fill="#15803D" />
  <circle cx="1060" cy="420" r="90" fill="#166534" />

  <!-- Courtyard Ground -->
  <rect x="0" y="470" width="1200" height="130" fill="#E2E8F0" />
  <rect x="0" y="470" width="1200" height="20" fill="#CBD5E1" />

  <!-- Students in School Uniforms (Navy Blazers, Ties, White Shirts) -->
  <!-- Student 1 -->
  <g transform="translate(420, 360)">
    <circle cx="20" cy="15" r="12" fill="#D97706" />
    <path d="M8,28 L32,28 L36,90 L4,90 Z" fill="#1E3A8A" />
    <polygon points="17,28 23,28 21,50 19,50" fill="#B30000" />
    <rect x="8" y="90" width="10" height="50" fill="#475569" />
    <rect x="22" y="90" width="10" height="50" fill="#475569" />
  </g>
  <!-- Student 2 -->
  <g transform="translate(500, 350)">
    <circle cx="20" cy="15" r="12" fill="#B45309" />
    <path d="M8,28 L32,28 L36,85 L4,85 Z" fill="#1E3A8A" />
    <polygon points="17,28 23,28 21,48 19,48" fill="#B30000" />
    <polygon points="4,85 36,85 40,115 0,115" fill="#1E3A8A" />
    <rect x="10" y="115" width="6" height="30" fill="#E2E8F0" />
    <rect x="24" y="115" width="6" height="30" fill="#E2E8F0" />
  </g>
  <!-- Student 3 -->
  <g transform="translate(580, 345)">
    <circle cx="20" cy="15" r="13" fill="#92400E" />
    <path d="M6,30 L34,30 L38,92 L2,92 Z" fill="#1E3A8A" />
    <polygon points="17,30 23,30 21,52 19,52" fill="#B30000" />
    <rect x="7" y="92" width="11" height="52" fill="#475569" />
    <rect x="22" y="92" width="11" height="52" fill="#475569" />
  </g>
  <!-- Student 4 -->
  <g transform="translate(660, 355)">
    <circle cx="20" cy="15" r="12" fill="#D97706" />
    <path d="M8,28 L32,28 L36,88 L4,88 Z" fill="#1E3A8A" />
    <polygon points="17,28 23,28 21,50 19,50" fill="#B30000" />
    <polygon points="4,88 36,88 40,118 0,118" fill="#1E3A8A" />
    <rect x="10" y="118" width="6" height="28" fill="#E2E8F0" />
    <rect x="24" y="118" width="6" height="28" fill="#E2E8F0" />
  </g>
  <!-- Student 5 -->
  <g transform="translate(740, 360)">
    <circle cx="20" cy="15" r="12" fill="#B45309" />
    <path d="M8,28 L32,28 L36,90 L4,90 Z" fill="#1E3A8A" />
    <polygon points="17,28 23,28 21,50 19,50" fill="#B30000" />
    <rect x="8" y="90" width="10" height="50" fill="#475569" />
    <rect x="22" y="90" width="10" height="50" fill="#475569" />
  </g>

  <!-- Warm cinematic gradient overlay so white hero text is crisp and readable -->
  <rect width="1200" height="600" fill="url(#overlay)" />
</svg>
