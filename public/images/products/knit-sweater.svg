<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FFFFFF" rx="8" />
  <!-- Maroon V-Neck Knit School Sweater with White Trim -->
  <g transform="translate(65, 45)">
    <!-- Main Sweater Silhouette -->
    <path d="M75,40 L195,40 L255,100 L235,120 L210,85 L210,290 L60,290 L60,85 L35,120 L15,100 Z" fill="#831843" stroke="#500724" stroke-width="2" />
    <!-- V-Neck Opening -->
    <polygon points="105,40 165,40 135,130" fill="#F8FAFC" stroke="#500724" stroke-width="1.5" />
    <!-- V-Neck Striped Ribbing -->
    <polygon points="105,40 115,40 135,120 155,40 165,40 135,130" fill="#FFFFFF" />
    <polygon points="110,40 115,40 135,120 155,40 160,40 135,126" fill="#9D174D" />
    <!-- Fine Cable Knit Texture Pattern -->
    <g stroke="#9D174D" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4">
      <line x1="85" y1="90" x2="85" y2="270" />
      <line x1="105" y1="135" x2="105" y2="270" />
      <line x1="125" y1="145" x2="125" y2="270" />
      <line x1="145" y1="145" x2="145" y2="270" />
      <line x1="165" y1="135" x2="165" y2="270" />
      <line x1="185" y1="90" x2="185" y2="270" />
    </g>
    <!-- Cuffs & Waist Ribbed Bands -->
    <rect x="60" y="275" width="150" height="20" fill="#700B34" stroke="#500724" stroke-width="1" />
    <line x1="60" y1="282" x2="210" y2="282" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="15" y="100" width="22" height="20" fill="#700B34" transform="rotate(-30 15 100)" />
    <rect x="233" y="100" width="22" height="20" fill="#700B34" transform="rotate(30 233 100)" />
  </g>
</svg>
