<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FFFFFF" rx="8" />
  <!-- Regulation Lycra Socks Pack with Twin Blue Stripes -->
  <g transform="translate(100, 50)">
    <!-- Socks Pair 1 (Background) -->
    <rect x="40" y="30" width="90" height="180" rx="10" fill="#E2E8F0" />
    <path d="M40,180 C40,240 70,270 120,270 L140,250 C110,230 110,180 110,180 Z" fill="#E2E8F0" />
    <!-- Socks Pair 2 (Foreground) -->
    <rect x="60" y="40" width="90" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <path d="M60,190 C60,250 90,280 145,280 L165,255 C130,240 130,190 130,190 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <!-- Blue Regulation Stripes on Rib Top -->
    <rect x="60" y="60" width="90" height="8" fill="#1E3A8A" />
    <rect x="60" y="76" width="90" height="8" fill="#1E3A8A" />
    <!-- Cushioned Heel and Toe Accents -->
    <path d="M60,210 C70,235 90,230 90,205 Z" fill="#F1F5F9" />
    <path d="M145,280 L165,255 C160,245 145,255 140,270 Z" fill="#F1F5F9" />
    <!-- Packaging Paper Band -->
    <rect x="45" y="125" width="120" height="55" rx="3" fill="#1B365D" />
    <text x="105" y="147" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">UNIVERSAL</text>
    <text x="105" y="160" font-family="sans-serif" font-size="7" fill="#93C5FD" text-anchor="middle">LYCRA BLEND · 3 PAIR</text>
    <rect x="50" y="172" width="110" height="3" fill="#B30000" />
  </g>
</svg>
