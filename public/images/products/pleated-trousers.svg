<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FFFFFF" rx="8" />
  <!-- Folded Heavy Pleated Uniform Trousers (Navy / Dark Grey) -->
  <g transform="translate(75, 45)">
    <!-- Waistband with Loops -->
    <rect x="25" y="40" width="200" height="28" rx="3" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" />
    <rect x="40" y="38" width="6" height="32" fill="#334155" />
    <rect x="85" y="38" width="6" height="32" fill="#334155" />
    <rect x="155" y="38" width="6" height="32" fill="#334155" />
    <rect x="200" y="38" width="6" height="32" fill="#334155" />
    <!-- Center Button & Zip Fly -->
    <circle cx="125" cy="54" r="3.5" fill="#475569" stroke="#94A3B8" stroke-width="1" />
    <path d="M125,68 L125,120" stroke="#0F172A" stroke-width="2" />
    <path d="M125,120 C130,125 135,122 135,110" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <!-- Trousers Main Body / Folded Hem -->
    <rect x="25" y="68" width="200" height="235" rx="4" fill="#1E293B" />
    <!-- Side Slanted Pockets -->
    <line x1="30" y1="72" x2="65" y2="135" stroke="#334155" stroke-width="2" />
    <line x1="220" y1="72" x2="185" y2="135" stroke="#334155" stroke-width="2" />
    <!-- Center Sharp Pleats -->
    <line x1="85" y1="70" x2="85" y2="300" stroke="#334155" stroke-width="2" stroke-dasharray="8 4" />
    <line x1="165" y1="70" x2="165" y2="300" stroke="#334155" stroke-width="2" stroke-dasharray="8 4" />
    <!-- Bottom Hem turn-up -->
    <line x1="25" y1="285" x2="225" y2="285" stroke="#475569" stroke-width="1.5" />
    <!-- Woven Brand Tag -->
    <rect x="110" y="44" width="30" height="12" fill="#B30000" rx="1" />
    <text x="125" y="53" font-family="sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VSU 32</text>
  </g>
</svg>
