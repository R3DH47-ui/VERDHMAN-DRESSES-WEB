<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FFFFFF" rx="8" />
  <!-- Complete School Uniform Bundle (Shirt + Trousers + Tie + Belt) -->
  <g transform="translate(40, 40)">
    <!-- Folded Shirt Base -->
    <rect x="20" y="30" width="180" height="240" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <polygon points="110,30 80,5 110,18 140,5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Trousers Overlap -->
    <rect x="130" y="70" width="170" height="210" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
    <line x1="215" y1="70" x2="215" y2="280" stroke="#334155" stroke-width="2" stroke-dasharray="6 3" />
    <!-- School Tie draped across -->
    <polygon points="120,50 135,50 150,220 135,250 120,220" fill="#1B365D" stroke="#0F172A" stroke-width="1.5" />
    <line x1="123" y1="90" x2="138" y2="80" stroke="#B30000" stroke-width="3" />
    <line x1="125" y1="130" x2="142" y2="120" stroke="#B30000" stroke-width="3" />
    <line x1="127" y1="170" x2="145" y2="160" stroke="#B30000" stroke-width="3" />
    <!-- School Belt with Brass Buckle -->
    <rect x="60" y="240" width="220" height="22" rx="3" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <rect x="150" y="235" width="30" height="32" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="2" />
    <rect x="157" y="242" width="16" height="18" fill="#18181B" />
    <!-- Complete Kit Red Ribbon Tag -->
    <rect x="210" y="30" width="85" height="24" rx="12" fill="#B30000" />
    <text x="252" y="46" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6-PIECE SET</text>
  </g>
</svg>
