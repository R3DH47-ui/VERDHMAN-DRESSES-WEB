<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FFFFFF" rx="8" />
  <!-- Woven Crest Formal Necktie -->
  <g transform="translate(130, 40)">
    <!-- Knot -->
    <polygon points="50,20 90,20 80,60 60,60" fill="#1B365D" stroke="#0F172A" stroke-width="1.5" />
    <polygon points="58,20 62,60 78,60 82,20" fill="#1E3A8A" />
    <!-- Diagonal Stripes on Knot -->
    <line x1="52" y1="30" x2="70" y2="20" stroke="#B30000" stroke-width="2.5" />
    <line x1="65" y1="55" x2="85" y2="42" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Main Tie Body -->
    <polygon points="62,60 78,60 100,280 70,320 40,280" fill="#1B365D" stroke="#0F172A" stroke-width="1.8" />
    <!-- Diagonal Regimental Stripes -->
    <g stroke-linecap="round">
      <line x1="56" y1="90" x2="84" y2="70" stroke="#B30000" stroke-width="4" />
      <line x1="54" y1="97" x2="82" y2="77" stroke="#F59E0B" stroke-width="1.5" />
      <line x1="52" y1="140" x2="88" y2="115" stroke="#B30000" stroke-width="4" />
      <line x1="50" y1="147" x2="86" y2="122" stroke="#F59E0B" stroke-width="1.5" />
      <line x1="48" y1="210" x2="92" y2="180" stroke="#B30000" stroke-width="4" />
      <line x1="46" y1="217" x2="90" y2="187" stroke="#F59E0B" stroke-width="1.5" />
      <line x1="44" y1="260" x2="96" y2="225" stroke="#B30000" stroke-width="4" />
    </g>
    <!-- Embroidered School Crest -->
    <circle cx="70" cy="170" r="12" fill="#FFFFFF" stroke="#B30000" stroke-width="1.5" />
    <path d="M64,166 L76,166 L76,174 L70,178 L64,174 Z" fill="#B30000" />
    <text x="70" y="173" font-family="serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">V</text>
  </g>
</svg>
