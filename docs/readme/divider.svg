<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B30000" stop-opacity="0"/>
      <stop offset="25%" stop-color="#B30000" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8F0000" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#B30000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B30000" stop-opacity="0"/>
